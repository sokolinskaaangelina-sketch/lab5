<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Advanced Positioning Task</title>
 <style>
  
  body {
   margin: 0;
   padding-top: 10px;
  
   display: flex;
   
   flex-direction: column;

   align-items: flex-start;
  }

 
  
  .box-static {
   width: 80px;
   height: 80px;
   background-color: lightblue;
   margin-left: 20px;   
   margin-bottom: 5px; 

  }
  
  .box-relative-1 {
   width: 100px;
   height: 100px;
   background-color: lightgreen;
   position: relative;
   left: 15px;  /* сдвиг вправо */
   top: 20px;   /* сдвиг вниз */
  }

  .box-relative-2 {
   width: 120px;
   height: 120px;
   background-color: pink;
   position: relative;
   left: 20px;
   top: -10px;  
  }

  
  .container {
   width: 300px;
   height: 300px;
   background-color: lightgray;
   margin-top: 20px;
   margin-left: 20px;

   position: relative;
  }

  
  .box-absolute-1 {
   width: 100px;
   height: 100px;
   background-color: coral;
   position: absolute;
   top: 30px;
   left: 30px;
   z-index: 3;  
  }

  .box-absolute-2 {
   width: 120px;
   height: 120px;
   background-color: skyblue;
   position: absolute;
   top: 70px;
   left: 50px;
   z-index: 2;  
  }

  .box-absolute-3 {
   width: 140px;
   height: 140px;
   background-color: purple;
   position: absolute;
   top: 120px;
   left: 80px;
   z-index: 1;  
  }

 
  .box-zindex-1 {
   width: 150px;
   height: 150px;
   background-color: lightcoral;
   position: absolute;
   top: 41px;
   left: 156px;
   z-index: 5;  
  }

  .box-zindex-2 {
   width: 150px;
   height: 150px;
   background-color: lightseagreen;
   position: absolute;
   top: 91px;
   left: 186px;
   z-index: 4;  
  }

  
  .box-fixed-1 {
   width: 80px;
   height: 80px;
   background-color: yellow;
   position: fixed;
   top: 0;
   right: 0;    
   z-index: 1;   
  }

  .box-fixed-2 {
   width: 100px;
   height: 100px;
   background-color: orange;
   position: fixed;
   bottom: 0;
   left: 0;     
  }
 </style>
</head>
<body>
 <!-- Static positioned boxes -->
 <div class="box-static">Static</div>
 <div class="box-static">Static</div>
 <!-- Relative positioned boxes -->
 <div class="box-relative-1">Relative 1</div>
 <div class="box-relative-2">Relative 2</div>
 <!-- Container with absolute positioned boxes inside -->
 <div class="container">
 <div class="box-absolute-1">Absolute 1</div>
 <div class="box-absolute-2">Absolute 2</div>
 <div class="box-absolute-3">Absolute 3</div>
 </div>
 <!-- Overlapping boxes with z-index outside container -->
 <div class="box-zindex-1">Z-Index 5</div>
 <div class="box-zindex-2">Z-Index 4</div>
 <!-- Fixed positioned boxes -->
 <div class="box-fixed-1">Fixed Top-Right</div>
 <div class="box-fixed-2">Fixed Bottom-Left</div>
</body>
</html>
